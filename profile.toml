# Your funding profile. Edit this file to change what lands in data/matches.csv.
# The full pool of open listings is always in data/listings.csv.

name = "GLIA water and water-adjacent cohort"

[filter]
# A listing matches if its title or summary contains any of these (case-insensitive,
# matched at the start of a word, so "aquacultur" catches aquaculture and aquacultural).
keywords = [
  "water", "wastewater", "stormwater", "storm water", "sewer", "watershed",
  "coastal", "great lakes", "ocean", "marine", "aquacultur", "fisheries", "seafood",
  "harbor", "port infrastructure", "seawall", "shoreline", "flood", "pfas", "wetland",
  "estuar", "drought", "irrigation", "harmful algal", "invasive species", "bycatch",
  "unmanned", "drone", "digital twin", "climate resilien", "coast resilien",
]

# Drop listings that mention any of these.
# "Watervliet" is an Army arsenal; "Marine Corps" notices match "marine" but are rarely about water.
exclude_keywords = ["Watervliet", "Marine Corps", "Marine Forces"]

# Keep only listings open to at least one of these applicant types.
# "Others (see listing)" catches listings that describe eligibility in text;
# some of those won't allow startups, so check the eligibility column.
eligibility_any = [
  "Small businesses",
  "For-profit organizations",
  "Unrestricted",
  "Others (see listing)",
  "Business",        # California's term for companies
  "Any vendor",      # city solicitations open to any registered vendor
]

# Skip funders whose code starts with any of these (HHS is mostly health research).
exclude_funder_codes = ["HHS"]

# Skip listings whose topics contain any of these. SAM.gov topics carry the
# federal product/service code (PSC) and industry code (NAICS). These cut
# construction, building repair and facility operations contracts:
# PSC Y/Z = construction and repair of buildings and sites, J = equipment repair,
# M = operating facilities, S = utilities and housekeeping, X = leases,
# NAICS 23 = construction.
exclude_topics = ["PSC Y", "PSC Z", "PSC J", "PSC M", "PSC S", "PSC X", "NAICS 23"]
