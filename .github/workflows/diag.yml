name: Diagnose California
on:
  push:
    branches: [diag-california]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Robots for current and candidate sources
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.robotparser
          UA = "glia-funding-tracker"
          urls = [
            "https://apps.mwrd.org/ContractAnnouncements/",
            "https://data.ca.gov/dataset/e1b1c799-cdd4-4219-af6d-93b79747fffb/resource/x",
            "https://data.cityofnewyork.us/resource/dg92-zbpx.json",
            "https://a856-cityrecord.nyc.gov/RequestDetail/1",
            "https://eprocurement.cityofchicago.org/OA_HTML/OA.jsp?OAFunc=PON_ABSTRACT_PAGE",
            "https://mvendor.cgieva.com/Vendor/public/solrconnect.jsp",
            "https://omb.illinois.gov/public/gata/csfa/OpportunityList.aspx",
            "https://sam.gov/api/prod/fileextractservices/v1/api/download/x",
            "https://www.commbuys.com/bso/view/search/external/advancedSearchBid.xhtml",
            "https://www.federalregister.gov/api/v1/documents.json",
            "https://www.usbr.gov/research/challenges/accepting.html",
            "https://xtech.army.mil/competitions/",
            "https://glwater.bonfirehub.com/PublicPortal/getOpenPublicOpportunitiesSectionData",
            "https://thewatercouncil.com/feed/",
            "https://buffalosewer.org/category/vendor-opportunities/feed/",
            "https://www.nsf.gov/rss/rss_www_funding_upcoming.xml",
            "https://currentwater.org/feed/",
            "https://www.clevelandohio.gov/city-hall/departments/finance/invitations-bid",
            "https://metrocouncil.org/About-Us/What-We-Do/DoingBusiness/Contracting-Opportunities.aspx",
            "https://api.usaspending.gov/api/v2/search/spending_by_award/",
            "https://data.www.sbir.gov/awarddatapublic/award_data.csv",
            "https://bidbuy.illinois.gov/bso/view/search/external/advancedSearchBid.xhtml",
            "https://www.waterrf.org/rss.xml",
            "https://swefcsrfswitchboard.unm.edu/srf/",
            "https://dnr.wisconsin.gov/sites/default/files/topic/Aid/loans/priorityList/x.xlsx",
            "https://efc.ny.gov/x",
            "https://projects.propublica.org/nonprofits/api/v2/search.json",
          ]
          from urllib.parse import urlsplit
          for u in urls:
              p = urlsplit(u); rob = f"{p.scheme}://{p.netloc}/robots.txt"
              try:
                  req = urllib.request.Request(rob, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode("utf-8", "replace"); status = r.status
              except Exception as e:
                  body, status = "", repr(e)[:80]
              if "<html" in body[:500].lower():
                  verdict = "no robots file (html)"
              elif not body:
                  verdict = "no robots file"
              else:
                  rp = urllib.robotparser.RobotFileParser(); rp.parse(body.splitlines())
                  verdict = "ALLOWED" if rp.can_fetch(UA, u) else "DISALLOWED"
              print(f"{verdict:24} {status!s:12} {u}")
          PY
